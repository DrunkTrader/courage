[package]
name = "courage-desktop"
version = "0.1.0"
description = "Courage desktop application"
authors = ["Courage contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "courage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
courage-core = { path = "../../../crates/courage-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.8", features = [] }
thiserror = "2"
