[package]
name = "courage-desktop"
version = "0.1.0"
description = "Courage desktop application"
authors = ["Courage contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "courage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
courage-core = { path = "../../../crates/courage-core" }
courage-store = { path = "../../../crates/courage-store" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.8", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
thiserror = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
